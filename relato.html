<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DISTRIBUIÇÃO DE CARTELAS</title>

<style>

/* =====================================================
   CONFIGURAÇÕES GERAIS
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f3f6;
    color: #222;
    min-height: 100vh;
}

.container {
    width: 95%;
    max-width: 1200px;
    margin: auto;
    padding: 20px 0 50px;
}


/* =====================================================
   CABEÇALHO
===================================================== */

header {
    background: #1f2937;
    color: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,.12);
}

header h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

header p {
    opacity: .8;
    font-size: 14px;
}


/* =====================================================
   CARDS
===================================================== */

.card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.card h2 {
    margin-bottom: 15px;
    color: #1f2937;
}


/* =====================================================
   INPUTS
===================================================== */

input,
select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    background: white;
}

input:focus,
select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37,99,235,.12);
}


/* =====================================================
   BOTÕES
===================================================== */

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    transform: translateY(-1px);
    opacity: .92;
}

.btn-cadastrar,
.btn-salvar {
    background: #2563eb;
    color: white;
}

.btn-adicionar {
    background: #16a34a;
    color: white;
}

.btn-excluir {
    background: #dc2626;
    color: white;
}

.btn-pdf {
    background: #7c3aed;
    color: white;
}

.btn-voltar {
    background: #6b7280;
    color: white;
}

.btn-editar {
    background: #f59e0b;
    color: white;
}

.btn-cancelar {
    background: #6b7280;
    color: white;
}


/* =====================================================
   STATUS FIREBASE
===================================================== */

.status-firestore {
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    background: #dcfce7;
    color: #166534;
}

.status-erro {
    background: #fee2e2;
    color: #991b1b;
}


/* =====================================================
   CADASTRO
===================================================== */

.cadastro {
    display: flex;
    gap: 10px;
}

.cadastro input {
    flex: 1;
}


/* =====================================================
   COLABORADORES
===================================================== */

.colaboradores {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
}

.colaborador {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 12px rgba(37,99,235,.25);
}

.colaborador-conteudo {
    cursor: pointer;
    margin-bottom: 15px;
}

.colaborador-conteudo:hover {
    opacity: .9;
}

.colaborador h3 {
    font-size: 18px;
    margin-bottom: 8px;
}

.colaborador small {
    opacity: .8;
}

.acoes-colaborador {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.acoes-colaborador button {
    flex: 1;
    min-width: 90px;
    padding: 8px 10px;
    font-size: 12px;
}


/* =====================================================
   EDIÇÃO DO NOME
===================================================== */

.area-edicao-nome {
    display: none;
    margin-top: 12px;
}

.area-edicao-nome.ativa {
    display: block;
}

.area-edicao-nome input {
    margin-bottom: 8px;
}

.botoes-edicao {
    display: flex;
    gap: 7px;
}

.botoes-edicao button {
    flex: 1;
    padding: 8px 10px;
}


/* =====================================================
   TABELAS
===================================================== */

.tabela-container {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
}

th {
    background: #1f2937;
    color: white;
    padding: 11px 8px;
    text-align: center;
    font-size: 13px;
}

td {
    padding: 7px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

td input {
    min-width: 100px;
    text-align: center;
}

.vendido {
    font-weight: bold;
    color: #16a34a;
    background: #f0fdf4;
    border-radius: 6px;
    padding: 10px;
    display: inline-block;
    min-width: 80px;
}


/* =====================================================
   AÇÕES
===================================================== */

.acoes {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.linha-acoes {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.linha-acoes h2 {
    margin: 0;
}


/* =====================================================
   FILTROS
===================================================== */

.filtros-relatorio {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.filtro {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.filtro label {
    font-size: 13px;
    font-weight: bold;
    color: #374151;
}

.botoes-filtro {
    display: flex;
    align-items: end;
    gap: 8px;
}

.botoes-filtro button {
    flex: 1;
    height: 42px;
}


/* =====================================================
   RELATÓRIO
===================================================== */

.relatorio-colaborador {
    margin-bottom: 30px;
}

.relatorio-colaborador h3 {
    background: #e5e7eb;
    padding: 12px;
    border-radius: 8px 8px 0 0;
}

.relatorio-tabela {
    min-width: 650px;
}

.total-row {
    background: #f3f4f6;
    font-weight: bold;
}


/* =====================================================
   MENSAGENS
===================================================== */

.mensagem {
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
    display: none;
    font-size: 14px;
}

.sucesso {
    background: #dcfce7;
    color: #166534;
}

.erro {
    background: #fee2e2;
    color: #991b1b;
}

.vazio {
    text-align: center;
    padding: 25px;
    color: #6b7280;
}


/* =====================================================
   UTILITÁRIOS
===================================================== */

.escondido {
    display: none !important;
}

footer {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    margin-top: 30px;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-width: 600px) {

    .container {
        width: 94%;
    }

    header h1 {
        font-size: 22px;
    }

    .cadastro {
        flex-direction: column;
    }

    .linha-acoes {
        flex-direction: column;
        align-items: stretch;
    }

    .botoes-filtro {
        align-items: stretch;
    }

}


/* =====================================================
   IMPRESSÃO
===================================================== */

@media print {

    body {
        background: white;
    }

    header,
    #areaCadastro,
    #areaColaboradores,
    #areaEdicao,
    .filtros-relatorio,
    .acoes,
    footer,
    #statusFirestore {
        display: none !important;
    }

    #areaRelatorio {
        display: block !important;
        box-shadow: none;
    }

}

</style>

</head>


<body>


<div class="container">


<header>

    <h1>
        CONTROLE DE ENTREGAS DE CARTELAS
    </h1>

    <p>
        Cadastro, lançamentos e relatório
    </p>

</header>


<div
    id="statusFirestore"
    class="status-firestore"
>
    Conectando ao Firestore...
</div>


<!-- =====================================================
     CADASTRO
===================================================== -->

<section
    class="card"
    id="areaCadastro"
>

    <h2>
        CADASTRAR VENDEDOR
    </h2>

    <div class="cadastro">

        <input
            type="text"
            id="nomeColaborador"
            placeholder="Digite o nome do colaborador"
            autocomplete="off"
        >

        <button
            class="btn-cadastrar"
            onclick="cadastrarColaborador()"
        >
            + Cadastrar
        </button>

    </div>

    <div
        id="mensagemCadastro"
        class="mensagem"
    ></div>

</section>


<!-- =====================================================
     COLABORADORES
===================================================== -->

<section
    class="card"
    id="areaColaboradores"
>

    <h2>
        Colaboradores
    </h2>

    <div
        id="listaColaboradores"
        class="colaboradores"
    ></div>

</section>


<!-- =====================================================
     LANÇAMENTOS
===================================================== -->

<section
    class="card escondido"
    id="areaEdicao"
>

    <div class="linha-acoes">

        <h2 id="tituloColaborador">
            Colaborador
        </h2>

        <button
            class="btn-voltar"
            onclick="voltarParaColaboradores()"
        >
            ← Voltar
        </button>

    </div>


    <div class="tabela-container">

        <table>

            <thead>

                <tr>

                    <th>DATA</th>
                    <th>INICIAL</th>
                    <th>FINAL</th>
                    <th>TOTAL</th>
                    <th>DEVOLVIDO</th>
                    <th>VENDIDO</th>

                </tr>

            </thead>

            <tbody
                id="tabelaLancamentos"
            ></tbody>

        </table>

    </div>


    <div class="acoes">

        <button
            class="btn-adicionar"
            onclick="adicionarLinha()"
        >
            + Adicionar Linha
        </button>

        <button
            class="btn-salvar"
            onclick="salvarInformacoes()"
        >
            💾 Salvar Informações
        </button>

        <button
            class="btn-excluir"
            onclick="excluirInformacao()"
        >
            🗑️ Excluir Informação
        </button>

    </div>


    <div
        id="mensagemEdicao"
        class="mensagem"
    ></div>

</section>


<!-- =====================================================
     RELATÓRIO
===================================================== -->

<section
    class="card"
    id="areaRelatorio"
>

    <div class="linha-acoes">

        <h2>
            RELATORIO DE DISTRIBUIÇÃO
        </h2>

        <button
            class="btn-pdf"
            onclick="exportarPDF()"
        >
            📄 Exportar PDF
        </button>

    </div>


    <div class="filtros-relatorio">


        <div class="filtro">

            <label>
                Data inicial
            </label>

            <input
                type="date"
                id="filtroDataInicial"
            >

        </div>


        <div class="filtro">

            <label>
                Data final
            </label>

            <input
                type="date"
                id="filtroDataFinal"
            >

        </div>


        <div class="filtro">

            <label>
                Colaborador
            </label>

            <select
                id="filtroColaborador"
            >

                <option value="">
                    TODOS OS COLABORADORES
                </option>

            </select>

        </div>


        <div class="botoes-filtro">

            <button
                class="btn-salvar"
                onclick="aplicarFiltros()"
            >
                🔎 Filtrar
            </button>

            <button
                class="btn-voltar"
                onclick="limparFiltros()"
            >
                🔄 Limpar
            </button>

        </div>

    </div>


    <div
        id="mensagemFiltro"
        class="mensagem"
    ></div>


    <div
        id="conteudoRelatorio"
    ></div>

</section>


<footer>
    Controle de Colaboradores — Firestore
</footer>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    doc,
    updateDoc,
    deleteDoc,
    getDocs,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   CONFIGURAÇÃO DO SEU FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBrHB8Defu0DrkV8POU4lAuAxCal6fqHM4",

    authDomain:
        "pitimbu-a09e3.firebaseapp.com",

    projectId:
        "pitimbu-a09e3",

    storageBucket:
        "pitimbu-a09e3.firebasestorage.app",

    messagingSenderId:
        "956873424564",

    appId:
        "1:956873424564:web:583c8405d288883d71e1e1"

};


/* =====================================================
   INICIALIZA FIREBASE
===================================================== */

try {

    const app =
        initializeApp(
            firebaseConfig
        );

    const db =
        getFirestore(
            app
        );


    window.db =
        db;


    window.firestoreFunctions = {

        collection,
        addDoc,
        doc,
        updateDoc,
        deleteDoc,
        getDocs,
        serverTimestamp

    };


    document.getElementById(
        "statusFirestore"
    ).textContent =
        "✓ Firestore conectado";


    await carregarColaboradores();

}
catch (erro) {

    console.error(erro);


    const status =
        document.getElementById(
            "statusFirestore"
        );


    status.textContent =
        "⚠️ Erro ao conectar ao Firestore";


    status.classList.add(
        "status-erro"
    );

}

</script>


<!-- =====================================================
     BIBLIOTECAS PDF
===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>


<script>

/* =====================================================
   VARIÁVEIS
===================================================== */

let colaboradores = [];

let colaboradorSelecionado = null;


/* =====================================================
   COLEÇÃO PRINCIPAL
===================================================== */

function colecaoColaboradores() {

    return window.firestoreFunctions.collection(
        window.db,
        "colaboradores"
    );

}


/* =====================================================
   CARREGAR COLABORADORES
===================================================== */

async function carregarColaboradores() {

    try {

        const snapshot =
            await window.firestoreFunctions.getDocs(
                colecaoColaboradores()
            );


        colaboradores = [];


        snapshot.forEach(
            documento => {

                colaboradores.push({

                    id:
                        documento.id,

                    nome:
                        documento.data().nome || "",

                    registros:
                        []

                });

            }
        );


        for (
            const colaborador
            of colaboradores
        ) {

            await carregarRegistros(
                colaborador
            );

        }


        mostrarColaboradores();

        carregarFiltroColaboradores();

        gerarRelatorio();

    }
    catch (erro) {

        console.error(erro);

    }

}


/* =====================================================
   CARREGAR REGISTROS
===================================================== */

async function carregarRegistros(
    colaborador
) {

    const registrosRef =
        window.firestoreFunctions.collection(

            window.db,

            "colaboradores",

            colaborador.id,

            "registros"

        );


    const snapshot =
        await window.firestoreFunctions.getDocs(
            registrosRef
        );


    colaborador.registros = [];


    snapshot.forEach(
        documento => {

            const dados =
                documento.data();


            colaborador.registros.push({

                id:
                    documento.id,

                data:
                    dados.data || "",

                inicial:
                    Number(
                        dados.inicial
                    ) || 0,

                final:
                    Number(
                        dados.final
                    ) || 0,

                total:
                    Number(
                        dados.total
                    ) || 0,

                devolvido:
                    Number(
                        dados.devolvido
                    ) || 0,

                vendido:
                    Number(
                        dados.vendido
                    ) || 0

            });

        }
    );

}


/* =====================================================
   CADASTRAR COLABORADOR
===================================================== */

async function cadastrarColaborador() {

    const campo =
        document.getElementById(
            "nomeColaborador"
        );


    const nome =
        campo.value.trim();


    if (!nome) {

        mostrarMensagem(
            "mensagemCadastro",
            "Digite o nome do colaborador.",
            "erro"
        );

        return;

    }


    const existe =
        colaboradores.some(
            colaborador =>
                colaborador.nome.toLowerCase() ===
                nome.toLowerCase()
        );


    if (existe) {

        mostrarMensagem(
            "mensagemCadastro",
            "Este colaborador já está cadastrado.",
            "erro"
        );

        return;

    }


    try {

        const documento =
            await window.firestoreFunctions.addDoc(

                colecaoColaboradores(),

                {
                    nome:
                        nome,

                    criadoEm:
                        window.firestoreFunctions.serverTimestamp()
                }

            );


        colaboradores.push({

            id:
                documento.id,

            nome:
                nome,

            registros:
                []

        });


        campo.value = "";


        mostrarColaboradores();

        carregarFiltroColaboradores();

        gerarRelatorio();


        mostrarMensagem(
            "mensagemCadastro",
            "Colaborador cadastrado com sucesso!",
            "sucesso"
        );

    }
    catch (erro) {

        console.error(erro);


        mostrarMensagem(
            "mensagemCadastro",
            "Erro ao cadastrar colaborador.",
            "erro"
        );

    }

}


/* =====================================================
   MOSTRAR COLABORADORES
===================================================== */

function mostrarColaboradores() {

    const lista =
        document.getElementById(
            "listaColaboradores"
        );


    if (
        colaboradores.length === 0
    ) {

        lista.innerHTML = `

            <div class="vazio">
                Nenhum colaborador cadastrado.
            </div>

        `;

        return;

    }


    lista.innerHTML =
        colaboradores.map(
            colaborador => {

                const quantidade =
                    colaborador.registros.length;


                return `

                    <div class="colaborador">

                        <div
                            class="colaborador-conteudo"
                            onclick="abrirColaborador('${colaborador.id}')"
                        >

                            <h3>
                                ${escaparHTML(
                                    colaborador.nome
                                )}
                            </h3>

                            <small>

                                ${quantidade}
                                registro
                                ${quantidade === 1 ? "" : "s"}

                            </small>

                        </div>


                        <div class="acoes-colaborador">

                            <button
                                class="btn-editar"
                                onclick="editarColaborador('${colaborador.id}', event)"
                            >
                                ✏️ Editar
                            </button>


                            <button
                                class="btn-excluir"
                                onclick="excluirColaborador('${colaborador.id}', event)"
                            >
                                🗑️ Excluir
                            </button>

                        </div>


                        <div
                            class="area-edicao-nome"
                            id="edicao-${colaborador.id}"
                        >

                            <input
                                type="text"
                                id="nome-edicao-${colaborador.id}"
                                value="${escaparHTML(
                                    colaborador.nome
                                )}"
                            >


                            <div class="botoes-edicao">

                                <button
                                    class="btn-salvar"
                                    onclick="salvarNomeColaborador('${colaborador.id}', event)"
                                >
                                    💾 Salvar
                                </button>


                                <button
                                    class="btn-cancelar"
                                    onclick="cancelarEdicao('${colaborador.id}', event)"
                                >
                                    Cancelar
                                </button>

                            </div>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =====================================================
   EDITAR COLABORADOR
===================================================== */

function editarColaborador(
    id,
    event
) {

    event.stopPropagation();


    const area =
        document.getElementById(
            "edicao-" + id
        );


    area.classList.add("ativa");


    const input =
        document.getElementById(
            "nome-edicao-" + id
        );


    input.focus();

    input.select();

}


/* =====================================================
   CANCELAR EDIÇÃO
===================================================== */

function cancelarEdicao(
    id,
    event
) {

    event.stopPropagation();


    document.getElementById(
        "edicao-" + id
    ).classList.remove(
        "ativa"
    );

}


/* =====================================================
   SALVAR NOME
===================================================== */

async function salvarNomeColaborador(
    id,
    event
) {

    event.stopPropagation();


    const input =
        document.getElementById(
            "nome-edicao-" + id
        );


    const novoNome =
        input.value.trim();


    if (!novoNome) {

        alert(
            "Digite um nome válido."
        );

        return;

    }


    try {

        await window.firestoreFunctions.updateDoc(

            window.firestoreFunctions.doc(

                window.db,

                "colaboradores",

                id

            ),

            {
                nome:
                    novoNome
            }

        );


        const colaborador =
            colaboradores.find(
                item =>
                    item.id === id
            );


        if (colaborador) {

            colaborador.nome =
                novoNome;

        }


        mostrarColaboradores();

        carregarFiltroColaboradores();

        gerarRelatorio();


        mostrarMensagem(
            "mensagemCadastro",
            "Nome alterado com sucesso!",
            "sucesso"
        );

    }
    catch (erro) {

        console.error(erro);

        alert(
            "Erro ao salvar o nome."
        );

    }

}


/* =====================================================
   EXCLUIR COLABORADOR
===================================================== */

async function excluirColaborador(
    id,
    event
) {

    event.stopPropagation();


    const colaborador =
        colaboradores.find(
            item =>
                item.id === id
        );


    if (!colaborador) return;


    const confirmar =
        confirm(

            "ATENÇÃO!\n\n" +
            "Deseja excluir o colaborador:\n\n" +
            colaborador.nome +
            "\n\n" +
            "Todos os seus lançamentos também serão excluídos."

        );


    if (!confirmar) return;


    try {

        const registrosRef =
            window.firestoreFunctions.collection(

                window.db,

                "colaboradores",

                id,

                "registros"

            );


        const snapshot =
            await window.firestoreFunctions.getDocs(
                registrosRef
            );


        for (
            const registro
            of snapshot.docs
        ) {

            await window.firestoreFunctions.deleteDoc(
                registro.ref
            );

        }


        await window.firestoreFunctions.deleteDoc(

            window.firestoreFunctions.doc(

                window.db,

                "colaboradores",

                id

            )

        );


        colaboradores =
            colaboradores.filter(
                item =>
                    item.id !== id
            );


        mostrarColaboradores();

        carregarFiltroColaboradores();

        gerarRelatorio();


        mostrarMensagem(
            "mensagemCadastro",
            "Colaborador excluído com sucesso.",
            "sucesso"
        );

    }
    catch (erro) {

        console.error(erro);

        alert(
            "Erro ao excluir colaborador."
        );

    }

}


/* =====================================================
   ABRIR COLABORADOR
===================================================== */

function abrirColaborador(
    id
) {

    const colaborador =
        colaboradores.find(
            item =>
                item.id === id
        );


    if (!colaborador) return;


    colaboradorSelecionado =
        id;


    document.getElementById(
        "tituloColaborador"
    ).textContent =
        colaborador.nome;


    document.getElementById(
        "areaCadastro"
    ).classList.add(
        "escondido"
    );


    document.getElementById(
        "areaColaboradores"
    ).classList.add(
        "escondido"
    );


    document.getElementById(
        "areaRelatorio"
    ).classList.add(
        "escondido"
    );


    document.getElementById(
        "areaEdicao"
    ).classList.remove(
        "escondido"
    );


    carregarTabelaDoColaborador(
        colaborador
    );

}


/* =====================================================
   CARREGAR TABELA
===================================================== */

function carregarTabelaDoColaborador(
    colaborador
) {

    const tabela =
        document.getElementById(
            "tabelaLancamentos"
        );


    tabela.innerHTML = "";


    if (
        colaborador.registros.length === 0
    ) {

        adicionarLinha();

        return;

    }


    colaborador.registros
        .slice()
        .sort(
            (a,b) =>
                (a.data || "")
                .localeCompare(
                    b.data || ""
                )
        )
        .forEach(
            registro =>
                adicionarLinha(
                    registro
                )
        );

}


/* =====================================================
   ADICIONAR LINHA
===================================================== */

function adicionarLinha(
    registro = null
) {

    const tabela =
        document.getElementById(
            "tabelaLancamentos"
        );


    const tr =
        document.createElement(
            "tr"
        );


    tr.innerHTML = `

        <td>

            <input
                type="date"
                class="campo-data"
                value="${registro?.data || ""}"
            >

        </td>


        <td>

            <input
                type="number"
                class="campo-inicial"
                min="0"
                step="1"
                value="${registro?.inicial ?? ""}"
            >

        </td>


        <td>

            <input
                type="number"
                class="campo-final"
                min="0"
                step="1"
                value="${registro?.final ?? ""}"
            >

        </td>


        <td>

            <input
                type="number"
                class="campo-total"
                min="0"
                step="1"
                value="${registro?.total ?? ""}"
            >

        </td>


        <td>

            <input
                type="number"
                class="campo-devolvido"
                min="0"
                step="1"
                value="${registro?.devolvido ?? ""}"
            >

        </td>


        <td>

            <span class="vendido">
                ${formatarNumero(
                    registro?.vendido ?? 0
                )}
            </span>

        </td>

    `;


    tabela.appendChild(tr);


    const total =
        tr.querySelector(
            ".campo-total"
        );


    const devolvido =
        tr.querySelector(
            ".campo-devolvido"
        );


    total.addEventListener(
        "input",
        () =>
            calcularVendido(
                devolvido
            )
    );


    devolvido.addEventListener(
        "input",
        () =>
            calcularVendido(
                devolvido
            )
    );


    calcularVendido(
        devolvido
    );

}


/* =====================================================
   CALCULAR VENDIDO
===================================================== */

function calcularVendido(
    campoDevolvido
) {

    const linha =
        campoDevolvido.closest(
            "tr"
        );


    const total =
        parseInt(
            linha.querySelector(
                ".campo-total"
            ).value
        ) || 0;


    const devolvido =
        parseInt(
            campoDevolvido.value
        ) || 0;


    const vendido =
        total -
        devolvido;


    linha.querySelector(
        ".vendido"
    ).textContent =
        formatarNumero(
            vendido
        );

}


/* =====================================================
   SALVAR INFORMAÇÕES
===================================================== */

async function salvarInformacoes() {

    if (!colaboradorSelecionado) return;


    const colaborador =
        colaboradores.find(
            item =>
                item.id ===
                colaboradorSelecionado
        );


    if (!colaborador) return;


    try {

        const registrosRef =
            window.firestoreFunctions.collection(

                window.db,

                "colaboradores",

                colaborador.id,

                "registros"

            );


        /*
         Apaga os registros antigos
         para salvar a tabela atual.
        */

        const antigos =
            await window.firestoreFunctions.getDocs(
                registrosRef
            );


        for (
            const registro
            of antigos.docs
        ) {

            await window.firestoreFunctions.deleteDoc(
                registro.ref
            );

        }


        const linhas =
            document.querySelectorAll(
                "#tabelaLancamentos tr"
            );


        const registros =
            [];


        for (
            const linha
            of linhas
        ) {

            const data =
                linha.querySelector(
                    ".campo-data"
                ).value;


            const inicial =
                parseInt(
                    linha.querySelector(
                        ".campo-inicial"
                    ).value
                ) || 0;


            const final =
                parseInt(
                    linha.querySelector(
                        ".campo-final"
                    ).value
                ) || 0;


            const total =
                parseInt(
                    linha.querySelector(
                        ".campo-total"
                    ).value
                ) || 0;


            const devolvido =
                parseInt(
                    linha.querySelector(
                        ".campo-devolvido"
                    ).value
                ) || 0;


            if (
                !data &&
                inicial === 0 &&
                final === 0 &&
                total === 0 &&
                devolvido === 0
            ) {
                continue;
            }


            const vendido =
                total -
                devolvido;


            const documento =
                await window.firestoreFunctions.addDoc(

                    registrosRef,

                    {
                        data,
                        inicial,
                        final,
                        total,
                        devolvido,
                        vendido,
                        criadoEm:
                            window.firestoreFunctions.serverTimestamp()
                    }

                );


            registros.push({

                id:
                    documento.id,

                data,
                inicial,
                final,
                total,
                devolvido,
                vendido

            });

        }


        colaborador.registros =
            registros;


        mostrarColaboradores();

        carregarFiltroColaboradores();

        gerarRelatorio();


        mostrarMensagem(
            "mensagemEdicao",
            "Informações salvas com sucesso!",
            "sucesso"
        );


        setTimeout(
            voltarParaColaboradores,
            700
        );

    }
    catch (erro) {

        console.error(erro);


        mostrarMensagem(
            "mensagemEdicao",
            "Erro ao salvar informações.",
            "erro"
        );

    }

}


/* =====================================================
   EXCLUIR TODOS OS LANÇAMENTOS
===================================================== */

async function excluirInformacao() {

    if (!colaboradorSelecionado) return;


    const colaborador =
        colaboradores.find(
            item =>
                item.id ===
                colaboradorSelecionado
        );


    if (!colaborador) return;


    if (
        !confirm(
            "Deseja excluir TODOS os lançamentos de " +
            colaborador.nome +
            "?"
        )
    ) {
        return;
    }


    try {

        const registrosRef =
            window.firestoreFunctions.collection(

                window.db,

                "colaboradores",

                colaborador.id,

                "registros"

            );


        const snapshot =
            await window.firestoreFunctions.getDocs(
                registrosRef
            );


        for (
            const registro
            of snapshot.docs
        ) {

            await window.firestoreFunctions.deleteDoc(
                registro.ref
            );

        }


        colaborador.registros = [];


        mostrarColaboradores();

        gerarRelatorio();


        mostrarMensagem(
            "mensagemEdicao",
            "Lançamentos excluídos.",
            "sucesso"
        );


        setTimeout(
            voltarParaColaboradores,
            700
        );

    }
    catch (erro) {

        console.error(erro);


        mostrarMensagem(
            "mensagemEdicao",
            "Erro ao excluir lançamentos.",
            "erro"
        );

    }

}


/* =====================================================
   VOLTAR
===================================================== */

function voltarParaColaboradores() {

    colaboradorSelecionado =
        null;


    document.getElementById(
        "areaEdicao"
    ).classList.add(
        "escondido"
    );


    document.getElementById(
        "areaCadastro"
    ).classList.remove(
        "escondido"
    );


    document.getElementById(
        "areaColaboradores"
    ).classList.remove(
        "escondido"
    );


    document.getElementById(
        "areaRelatorio"
    ).classList.remove(
        "escondido"
    );


    gerarRelatorio();

}


/* =====================================================
   FILTRO DE COLABORADORES
===================================================== */

function carregarFiltroColaboradores() {

    const select =
        document.getElementById(
            "filtroColaborador"
        );


    if (!select) return;


    const valorAtual =
        select.value;


    select.innerHTML = `

        <option value="">
            Todos os colaboradores
        </option>

    `;


    colaboradores
        .slice()
        .sort(
            (a,b) =>
                a.nome.localeCompare(
                    b.nome
                )
        )
        .forEach(
            colaborador => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    colaborador.id;


                option.textContent =
                    colaborador.nome;


                select.appendChild(
                    option
                );

            }
        );


    if (
        colaboradores.some(
            colaborador =>
                colaborador.id ===
                valorAtual
        )
    ) {

        select.value =
            valorAtual;

    }

}


/* =====================================================
   APLICAR FILTROS
===================================================== */

function aplicarFiltros() {

    const dataInicial =
        document.getElementById(
            "filtroDataInicial"
        ).value;


    const dataFinal =
        document.getElementById(
            "filtroDataFinal"
        ).value;


    const colaboradorId =
        document.getElementById(
            "filtroColaborador"
        ).value;


    if (
        dataInicial &&
        dataFinal &&
        dataInicial > dataFinal
    ) {

        mostrarMensagem(
            "mensagemFiltro",
            "A data inicial não pode ser maior que a data final.",
            "erro"
        );

        return;

    }


    gerarRelatorio(
        dataInicial,
        dataFinal,
        colaboradorId
    );

}


/* =====================================================
   LIMPAR FILTROS
===================================================== */

function limparFiltros() {

    document.getElementById(
        "filtroDataInicial"
    ).value = "";


    document.getElementById(
        "filtroDataFinal"
    ).value = "";


    document.getElementById(
        "filtroColaborador"
    ).value = "";


    gerarRelatorio();

}


/* =====================================================
   GERAR RELATÓRIO
===================================================== */

function gerarRelatorio(
    dataInicial = "",
    dataFinal = "",
    colaboradorId = ""
) {

    const area =
        document.getElementById(
            "conteudoRelatorio"
        );


    let lista =
        colaboradores;


    if (colaboradorId) {

        lista =
            colaboradores.filter(
                colaborador =>
                    colaborador.id ===
                    colaboradorId
            );

    }


    let html = "";

    let encontrou =
        false;


    lista.forEach(
        colaborador => {

            let registros =
                colaborador.registros.filter(
                    registro => {

                        const data =
                            registro.data || "";


                        if (
                            dataInicial &&
                            data < dataInicial
                        ) {
                            return false;
                        }


                        if (
                            dataFinal &&
                            data > dataFinal
                        ) {
                            return false;
                        }


                        return true;

                    }
                );


            registros.sort(
                (a,b) =>
                    (a.data || "")
                    .localeCompare(
                        b.data || ""
                    )
            );


            if (
                registros.length === 0
            ) {
                return;
            }


            encontrou = true;


            const totalGeral =
                registros.reduce(
                    (soma,r) =>
                        soma +
                        Number(r.total || 0),
                    0
                );


            const devolvidoGeral =
                registros.reduce(
                    (soma,r) =>
                        soma +
                        Number(r.devolvido || 0),
                    0
                );


            const vendidoGeral =
                registros.reduce(
                    (soma,r) =>
                        soma +
                        Number(r.vendido || 0),
                    0
                );


            html += `

                <div class="relatorio-colaborador">

                    <h3>
                        ${escaparHTML(
                            colaborador.nome
                        )}
                    </h3>


                    <div class="tabela-container">

                        <table class="relatorio-tabela">

                            <thead>

                                <tr>

                                    <th>DATA</th>
                                    <th>INICIAL</th>
                                    <th>FINAL</th>
                                    <th>TOTAL</th>
                                    <th>DEVOLVIDO</th>
                                    <th>VENDIDO</th>

                                </tr>

                            </thead>


                            <tbody>

            `;


            registros.forEach(
                registro => {

                    html += `

                        <tr>

                            <td>
                                ${formatarData(
                                    registro.data
                                )}
                            </td>

                            <td>
                                ${formatarNumero(
                                    registro.inicial
                                )}
                            </td>

                            <td>
                                ${formatarNumero(
                                    registro.final
                                )}
                            </td>

                            <td>
                                ${formatarNumero(
                                    registro.total
                                )}
                            </td>

                            <td>
                                ${formatarNumero(
                                    registro.devolvido
                                )}
                            </td>

                            <td>
                                <strong>
                                    ${formatarNumero(
                                        registro.vendido
                                    )}
                                </strong>
                            </td>

                        </tr>

                    `;

                }
            );


            html += `

                <tr class="total-row">

                    <td>
                        TOTAL
                    </td>

                    <td></td>

                    <td></td>

                    <td>
                        ${formatarNumero(
                            totalGeral
                        )}
                    </td>

                    <td>
                        ${formatarNumero(
                            devolvidoGeral
                        )}
                    </td>

                    <td>
                        ${formatarNumero(
                            vendidoGeral
                        )}
                    </td>

                </tr>

                </tbody>

                </table>

                </div>

                </div>

            `;

        }
    );


    if (!encontrou) {

        html = `

            <div class="vazio">

                Nenhum lançamento encontrado
                para os filtros selecionados.

            </div>

        `;

    }


    area.innerHTML =
        html;

}


/* =====================================================
   EXPORTAR PDF
===================================================== */

function exportarPDF() {

    const dataInicial =
        document.getElementById(
            "filtroDataInicial"
        ).value;


    const dataFinal =
        document.getElementById(
            "filtroDataFinal"
        ).value;


    const colaboradorId =
        document.getElementById(
            "filtroColaborador"
        ).value;


    if (
        dataInicial &&
        dataFinal &&
        dataInicial > dataFinal
    ) {

        alert(
            "A data inicial não pode ser maior que a data final."
        );

        return;

    }


    let lista =
        colaboradores;


    if (colaboradorId) {

        lista =
            colaboradores.filter(
                colaborador =>
                    colaborador.id ===
                    colaboradorId
            );

    }


    const {
        jsPDF
    } =
        window.jspdf;


    const doc =
        new jsPDF({

            orientation:
                "landscape",

            unit:
                "mm",

            format:
                "a4"

        });


    let primeiraPagina =
        true;


    let encontrou =
        false;


    lista.forEach(
        colaborador => {

            const registros =
                colaborador.registros
                .filter(
                    registro => {

                        const data =
                            registro.data || "";


                        if (
                            dataInicial &&
                            data < dataInicial
                        ) {
                            return false;
                        }


                        if (
                            dataFinal &&
                            data > dataFinal
                        ) {
                            return false;
                        }


                        return true;

                    }
                )
                .sort(
                    (a,b) =>
                        (a.data || "")
                        .localeCompare(
                            b.data || ""
                        )
                );


            if (
                registros.length === 0
            ) {
                return;
            }


            encontrou = true;


            if (!primeiraPagina) {
                doc.addPage();
            }


            primeiraPagina = false;


            doc.setFontSize(18);

            doc.text(
                "RELATÓRIO DE COLABORADOR",
                14,
                15
            );


            doc.setFontSize(13);

            doc.text(
                "Colaborador: " +
                colaborador.nome,
                14,
                24
            );


            doc.setFontSize(10);


            let periodo =
                "Período: ";


            periodo +=
                dataInicial
                ? formatarData(dataInicial)
                : "Início";


            periodo +=
                " até ";


            periodo +=
                dataFinal
                ? formatarData(dataFinal)
                : "Fim";


            doc.text(
                periodo,
                14,
                30
            );


            const dados =
                registros.map(
                    registro => [

                        formatarData(
                            registro.data
                        ),

                        formatarNumero(
                            registro.inicial
                        ),

                        formatarNumero(
                            registro.final
                        ),

                        formatarNumero(
                            registro.total
                        ),

                        formatarNumero(
                            registro.devolvido
                        ),

                        formatarNumero(
                            registro.vendido
                        )

                    ]
                );


            const total =
                registros.reduce(
                    (soma,r) =>
                        soma +
                        Number(r.total || 0),
                    0
                );


            const devolvido =
                registros.reduce(
                    (soma,r) =>
                        soma +
                        Number(r.devolvido || 0),
                    0
                );


            const vendido =
                registros.reduce(
                    (soma,r) =>
                        soma +
                        Number(r.vendido || 0),
                    0
                );


            dados.push([

                "TOTAL",
                "",
                "",
                formatarNumero(total),
                formatarNumero(devolvido),
                formatarNumero(vendido)

            ]);


            doc.autoTable({

                startY: 35,

                head: [[

                    "DATA",
                    "INICIAL",
                    "FINAL",
                    "TOTAL",
                    "DEVOLVIDO",
                    "VENDIDO"

                ]],

                body: dados,

                theme: "grid",

                styles: {
                    fontSize: 9,
                    halign: "center"
                },

                headStyles: {
                    fillColor: [31,41,55],
                    textColor: 255
                }

            });

        }
    );


    if (!encontrou) {

        alert(
            "Não existem lançamentos para os filtros selecionados."
        );

        return;

    }


    const agora =
        new Date();


    const nome =
        colaboradorId &&
        lista[0]
        ? lista[0].nome
        : "todos-colaboradores";


    const nomeArquivo =
        "relatorio_" +
        nome
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[^a-zA-Z0-9]+/g,
            "_"
        ) +
        "_" +
        agora.getFullYear() +
        "-" +
        String(
            agora.getMonth() + 1
        ).padStart(2,"0") +
        "-" +
        String(
            agora.getDate()
        ).padStart(2,"0") +
        ".pdf";


    doc.save(
        nomeArquivo
    );

}


/* =====================================================
   FORMATAR NÚMERO
===================================================== */

function formatarNumero(
    valor
) {

    return String(
        Math.round(
            Number(valor) || 0
        )
    );

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(
    data
) {

    if (!data) return "";


    const partes =
        data.split("-");


    if (
        partes.length !== 3
    ) {
        return data;
    }


    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(
    texto
) {

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   MENSAGENS
===================================================== */

function mostrarMensagem(
    elementoId,
    texto,
    tipo
) {

    const elemento =
        document.getElementById(
            elementoId
        );


    if (!elemento) return;


    elemento.textContent =
        texto;


    elemento.className =
        "mensagem " +
        tipo;


    elemento.style.display =
        "block";


    setTimeout(
        () => {

            elemento.style.display =
                "none";

        },
        3000
    );

}


/* =====================================================
   ENTER NO CADASTRO
===================================================== */

document
    .getElementById(
        "nomeColaborador"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                cadastrarColaborador();

            }

        }
    );
