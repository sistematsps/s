<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login - Simulador</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at top,
            #263238,
            #101417 55%,
            #080a0c
        );

    color: white;

}

.container {

    width: 100%;

    max-width: 420px;

    padding: 20px;

}

.box {

    background: rgba(255,255,255,.06);

    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(12px);

    border-radius: 18px;

    padding: 32px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.45);

}

.logo {

    text-align: center;

    margin-bottom: 25px;

}

.logo-icon {

    width: 70px;

    height: 70px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #37474f;

    border-radius: 18px;

    font-size: 30px;

}

h1 {

    margin-top: 15px;

    font-size: 24px;

}

.subtitulo {

    color: #aeb7bc;

    font-size: 12px;

    margin-top: 6px;

}

.aviso {

    margin-bottom: 20px;

    padding: 10px;

    text-align: center;

    border-radius: 8px;

    background: rgba(255,193,7,.10);

    color: #ffd86b;

    font-size: 11px;

}

.campo {

    margin-bottom: 17px;

}

label {

    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    color: #cfd8dc;

}

input {

    width: 100%;

    height: 48px;

    border-radius: 8px;

    border: 1px solid #455a64;

    background: #10171b;

    color: white;

    padding: 0 13px;

    outline: none;

}

input:focus {

    border-color: #90a4ae;

}

button {

    width: 100%;

    height: 49px;

    border: none;

    border-radius: 8px;

    background: #455a64;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}

button:hover {

    background: #546e7a;

}

button:disabled {

    opacity: .6;

    cursor: wait;

}

#mensagem {

    text-align: center;

    min-height: 22px;

    margin-top: 17px;

    font-size: 13px;

}

.erro {

    color: #ff8a80;

}

.sucesso {

    color: #81c784;

}

</style>

</head>


<body>


<div class="container">

<div class="box">


<div class="logo">

<div class="logo-icon">
🎟️
</div>

<h1>SIMULADOR</h1>

<div class="subtitulo">
Sistema de Estudos e Pesquisas
</div>

</div>


<div class="aviso">

AMBIENTE FICTÍCIO —
CRÉDITOS SEM VALOR MONETÁRIO

</div>


<form id="formLogin">


<div class="campo">

<label for="email">
E-mail
</label>

<input
    type="email"
    id="email"
    autocomplete="username"
    required
    placeholder="Digite seu e-mail"
>

</div>


<div class="campo">

<label for="senha">
Senha
</label>

<input
    type="password"
    id="senha"
    autocomplete="current-password"
    required
    placeholder="Digite sua senha"
>

</div>


<button
    type="submit"
    id="btnLogin"
>

ENTRAR

</button>


</form>


<div id="mensagem"></div>


</div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyC4AAbC8vCFAmlPlur12Nm7YBKPjaSjumM",
  authDomain: "meuappweb-65522.firebaseapp.com",
  projectId: "meuappweb-65522",
  storageBucket: "meuappweb-65522.firebasestorage.app",
  messagingSenderId: "305368794616",
  appId: "1:305368794616:web:3199c6836a986d896ac20d",
  measurementId: "G-QN7GFD99N0"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


const form =
    document.getElementById("formLogin");

const btn =
    document.getElementById("btnLogin");

const mensagem =
    document.getElementById("mensagem");


function mostrarMensagem(texto, tipo) {

    mensagem.textContent = texto;

    mensagem.className = tipo;

}


async function carregarPerfil(user) {

    try {

        const referencia =
            doc(
                db,
                "usuarios",
                user.uid
            );


        const documento =
            await getDoc(referencia);


        if (!documento.exists()) {

            await signOut(auth);

            mostrarMensagem(
                "Usuário autenticado, mas sem perfil no sistema.",
                "erro"
            );

            btn.disabled = false;

            btn.textContent = "ENTRAR";

            return;

        }


        const dados =
            documento.data();


        if (dados.ativo !== true) {

            await signOut(auth);

            mostrarMensagem(
                "Este usuário está desativado.",
                "erro"
            );

            btn.disabled = false;

            btn.textContent = "ENTRAR";

            return;

        }


        const perfis = [
            "MASTER",
            "GERENTE",
            "VENDEDOR"
        ];


        if (!perfis.includes(dados.perfil)) {

            await signOut(auth);

            mostrarMensagem(
                "Perfil não autorizado.",
                "erro"
            );

            return;

        }


        const sessao = {

            uid: user.uid,

            nome: dados.nome || "",

            email: dados.email || user.email,

            perfil: dados.perfil,

            areaId: dados.areaId || null,

            vendedorId:
                dados.vendedorId || null

        };


        sessionStorage.setItem(
            "usuarioSessao",
            JSON.stringify(sessao)
        );


        mostrarMensagem(
            "Login realizado. Entrando...",
            "sucesso"
        );


        setTimeout(() => {

            if (dados.perfil === "MASTER") {

                window.location.href =
                    "painel-master.html";

            }

            else if (
                dados.perfil === "GERENTE"
            ) {

                window.location.href =
                    "painel-gerente.html";

            }

            else if (
                dados.perfil === "VENDEDOR"
            ) {

                window.location.href =
                    "painel-vendedor.html";

            }

        }, 500);


    } catch (erro) {

        console.error(erro);

        await signOut(auth);

        mostrarMensagem(
            "Erro ao consultar o perfil.",
            "erro"
        );

        btn.disabled = false;

        btn.textContent = "ENTRAR";

    }

}


form.addEventListener(
    "submit",
    async (evento) => {

        evento.preventDefault();


        const email =
            document.getElementById("email")
            .value
            .trim();

        const senha =
            document.getElementById("senha")
            .value;


        btn.disabled = true;

        btn.textContent =
            "ENTRANDO...";


        try {

            const resultado =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    senha
                );


            await carregarPerfil(
                resultado.user
            );


        } catch (erro) {

            console.error(erro);


            let texto =
                "E-mail ou senha incorretos.";


            if (
                erro.code ===
                "auth/too-many-requests"
            ) {

                texto =
                    "Muitas tentativas. Aguarde alguns instantes.";

            }


            if (
                erro.code ===
                "auth/network-request-failed"
            ) {

                texto =
                    "Falha de conexão com o Firebase.";

            }


            mostrarMensagem(
                texto,
                "erro"
            );


            btn.disabled = false;

            btn.textContent =
                "ENTRAR";

        }

    }
);

</script>

</body>

</html>
