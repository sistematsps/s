<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema de Simulação</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">

            <div class="logo-icon">
                🎟️
            </div>

            <h1>SIMULADOR</h1>

            <p>Sistema de Estudos e Pesquisas</p>

        </div>

        <div class="aviso">
            AMBIENTE FICTÍCIO — CRÉDITOS SEM VALOR MONETÁRIO
        </div>

        <form id="formLogin">

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="username"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>

            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn-login"
                id="btnLogin"
            >
                ENTRAR
            </button>

        </form>

        <div id="mensagem"></div>

        <div class="rodape">
            Sistema educacional de simulação
        </div>

    </div>

</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    // =====================================================
    // FIREBASE
    // =====================================================

    const firebaseConfig = {

        apiKey: "AIzaSyAsOqTDBkSxO1I28WNmf3iB22M4MU_dU50",

        authDomain: "meuappweb-65522.firebaseapp.com",

        projectId: "meuappweb-65522",

        storageBucket: "meuappweb-65522.firebasestorage.app",

        messagingSenderId: "305368794616",

        appId: "1:305368794616:web:f5c8800c7bf4694d6ac20d",

        measurementId: "G-R3MQX6NPWB"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const formLogin = document.getElementById("formLogin");

    const emailInput = document.getElementById("email");

    const senhaInput = document.getElementById("senha");

    const btnLogin = document.getElementById("btnLogin");

    const mensagem = document.getElementById("mensagem");


    // =====================================================
    // MENSAGEM
    // =====================================================

    function mostrarMensagem(texto, tipo = "erro") {

        mensagem.textContent = texto;

        mensagem.className = tipo;

    }


    // =====================================================
    // REDIRECIONAMENTO
    // =====================================================

    function redirecionarPerfil(perfil) {

        switch (perfil) {

            case "MASTER":

                window.location.href = "painel-master.html";

                break;


            case "GERENTE":

                window.location.href = "painel-gerente.html";

                break;


            case "VENDEDOR":

                window.location.href = "painel-vendedor.html";

                break;


            default:

                mostrarMensagem(
                    "Perfil de usuário inválido.",
                    "erro"
                );

                auth.signOut();

        }

    }


    // =====================================================
    // VERIFICAR USUÁRIO NO FIRESTORE
    // =====================================================

    async function carregarPerfil(uid) {

        try {

            const referencia = doc(db, "usuarios", uid);

            const documento = await getDoc(referencia);


            if (!documento.exists()) {

                await auth.signOut();

                mostrarMensagem(
                    "Usuário autenticado, mas não cadastrado no sistema.",
                    "erro"
                );

                return;

            }


            const dados = documento.data();


            // -------------------------------------------------
            // VERIFICAR STATUS
            // -------------------------------------------------

            if (dados.ativo !== true) {

                await auth.signOut();

                mostrarMensagem(
                    "Este usuário está desativado.",
                    "erro"
                );

                return;

            }


            // -------------------------------------------------
            // VERIFICAR PERFIL
            // -------------------------------------------------

            const perfisPermitidos = [
                "MASTER",
                "GERENTE",
                "VENDEDOR"
            ];


            if (!perfisPermitidos.includes(dados.perfil)) {

                await auth.signOut();

                mostrarMensagem(
                    "Perfil não autorizado.",
                    "erro"
                );

                return;

            }


            // -------------------------------------------------
            // SALVAR DADOS DA SESSÃO
            // -------------------------------------------------

            const sessao = {

                uid: uid,

                nome: dados.nome || "",

                perfil: dados.perfil,

                areaId: dados.areaId || null,

                vendedorId: dados.vendedorId || null

            };


            sessionStorage.setItem(
                "usuarioSessao",
                JSON.stringify(sessao)
            );


            mostrarMensagem(
                "Login realizado. Entrando...",
                "sucesso"
            );


            setTimeout(() => {

                redirecionarPerfil(dados.perfil);

            }, 500);


        } catch (erro) {

            console.error(erro);

            await auth.signOut();

            mostrarMensagem(
                "Não foi possível consultar o perfil do usuário.",
                "erro"
            );

        }

    }


    // =====================================================
    // LOGIN
    // =====================================================

    formLogin.addEventListener("submit", async (evento) => {

        evento.preventDefault();


        const email = emailInput.value.trim();

        const senha = senhaInput.value;


        if (!email || !senha) {

            mostrarMensagem(
                "Informe o e-mail e a senha."
            );

            return;

        }


        btnLogin.disabled = true;

        btnLogin.textContent = "ENTRANDO...";

        mostrarMensagem("");


        try {

            const resultado =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    senha
                );


            await carregarPerfil(resultado.user.uid);


        } catch (erro) {

            console.error(erro);


            let texto =
                "Não foi possível realizar o login.";


            switch (erro.code) {

                case "auth/invalid-credential":

                    texto =
                        "E-mail ou senha incorretos.";

                    break;


                case "auth/user-disabled":

                    texto =
                        "Este usuário foi desativado.";

                    break;


                case "auth/too-many-requests":

                    texto =
                        "Muitas tentativas. Aguarde alguns instantes.";

                    break;


                case "auth/network-request-failed":

                    texto =
                        "Falha de conexão com o Firebase.";

                    break;

            }


            mostrarMensagem(texto);


            btnLogin.disabled = false;

            btnLogin.textContent = "ENTRAR";

        }

    });


    // =====================================================
    // VERIFICAR SE JÁ ESTÁ LOGADO
    // =====================================================

    onAuthStateChanged(auth, async (user) => {

        if (!user) {

            return;

        }


        // Se já estiver autenticado,
        // verifica o perfil automaticamente.

        await carregarPerfil(user.uid);

    });

</script>

</body>

</html>
