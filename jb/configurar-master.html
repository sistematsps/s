</div>

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        query,
        where,
        getDocs,
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    // ==========================================
    // FIREBASE
    // ==========================================

    const firebaseConfig = {
        apiKey: "AIzaSyAsOqTDBSxO1I28WNmf3iB22M4MU_dU50",
        authDomain: "meuappweb-65522.firebaseapp.com",
        projectId: "meuappweb-65522",
        storageBucket: "meuappweb-65522.firebasestorage.app",
        messagingSenderId: "305368794616",
        appId: "1:305368794616:web:f5c8800c7bf4694d6ac20d",
        measurementId: "G-R3MQX6NPWB"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const form = document.getElementById("formMaster");
    const mensagem = document.getElementById("mensagem");
    const btnCriar = document.getElementById("btnCriar");


    // ==========================================
    // MENSAGEM
    // ==========================================

    function mostrarMensagem(texto, tipo) {

        mensagem.textContent = texto;

        mensagem.className = "mensagem " + tipo;
    }


    // ==========================================
    // VERIFICAR SE JÁ EXISTE MASTER
    // ==========================================

    async function verificarMaster() {

        try {

            const q = query(
                collection(db, "usuarios"),
                where("perfil", "==", "MASTER")
            );

            const resultado = await getDocs(q);

            if (!resultado.empty) {

                mostrarMensagem(
                    "Já existe um usuário MASTER cadastrado. Você será direcionado para o login.",
                    "erro"
                );

                form.style.display = "none";

                setTimeout(() => {

                    window.location.href = "login.html";

                }, 2500);

                return true;
            }

            return false;

        } catch (erro) {

            console.error("Erro ao verificar MASTER:", erro);

            mostrarMensagem(
                "Não foi possível verificar o cadastro do MASTER. Verifique sua conexão com o Firebase e as regras do Firestore.",
                "erro"
            );

            return true;
        }
    }


    // ==========================================
    // CRIAR MASTER
    // ==========================================

    form.addEventListener("submit", async (event) => {

        event.preventDefault();


        const nome = document.getElementById("nome").value.trim();

        const email = document.getElementById("email").value.trim();

        const senha = document.getElementById("senha").value;

        const confirmarSenha =
            document.getElementById("confirmarSenha").value;


        // Validações

        if (!nome) {

            mostrarMensagem(
                "Digite o nome do administrador.",
                "erro"
            );

            return;
        }


        if (senha.length < 6) {

            mostrarMensagem(
                "A senha precisa ter pelo menos 6 caracteres.",
                "erro"
            );

            return;
        }


        if (senha !== confirmarSenha) {

            mostrarMensagem(
                "As senhas não são iguais.",
                "erro"
            );

            return;
        }


        btnCriar.disabled = true;

        btnCriar.textContent = "Criando MASTER...";


        try {

            // Verifica novamente antes de criar
            const jaExiste = await verificarMaster();

            if (jaExiste) {

                btnCriar.disabled = false;

                btnCriar.textContent = "👑 Criar MASTER";

                return;
            }


            // ==========================================
            // CRIA USUÁRIO NO FIREBASE AUTH
            // ==========================================

            const resultado =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    senha
                );


            const uid = resultado.user.uid;


            // ==========================================
            // CRIA PERFIL NO FIRESTORE
            // ==========================================

            await setDoc(
                doc(db, "usuarios", uid),
                {

                    nome: nome,

                    email: email,

                    perfil: "MASTER",

                    ativo: true,

                    areaId: null,

                    vendedorId: null,

                    saldoVirtual: 0,

                    criadoEm: serverTimestamp()

                }
            );


            // Desloga para deixar o usuário entrar
            // normalmente pela tela de login.

            await signOut(auth);


            mostrarMensagem(
                "MASTER criado com sucesso! Redirecionando para o login...",
                "sucesso"
            );


            form.style.display = "none";


            setTimeout(() => {

                window.location.href = "login.html";

            }, 1800);


        } catch (erro) {

            console.error("Erro ao criar MASTER:", erro);


            let texto = "Não foi possível criar o MASTER.";


            if (erro.code === "auth/email-already-in-use") {

                texto =
                    "Este e-mail já está cadastrado no Firebase Authentication.";

            } else if (erro.code === "auth/invalid-email") {

                texto =
                    "O e-mail informado não é válido.";

            } else if (erro.code === "auth/weak-password") {

                texto =
                    "A senha é muito fraca. Use pelo menos 6 caracteres.";

            } else if (erro.code === "permission-denied") {

                texto =
                    "O Firestore recusou a gravação. Verifique as regras do Firestore.";

            }


            mostrarMensagem(texto, "erro");


            btnCriar.disabled = false;

            btnCriar.textContent = "👑 Criar MASTER";

        }

    });


    // ==========================================
    // INÍCIO DA PÁGINA
    // ==========================================

    verificarMaster();

</script>

</body>
