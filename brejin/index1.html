<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.login-box {
  width: 100%;
  max-width: 380px;
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

h2 {
  text-align: center;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 25px;
  border: none;
  border-radius: 6px;
  background: #d32f2f;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #b71c1c;
}

#mensagem {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="login-box">

  <h2>Login com Código e Senha Interna</h2>

  <label for="codigo">Código</label>
  <input
    type="text"
    id="codigo"
    autocomplete="username"
    placeholder="Digite seu código"
  >

  <label for="senha">Senha</label>
  <input
    type="password"
    id="senha"
    autocomplete="current-password"
    placeholder="Digite sua senha"
  >

  <button id="btnEntrar">
    ENTRAR
  </button>

  <div id="mensagem"></div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCrEImfnBQvS-kyiXW9a6wgt9IHyPTaQqE",
  authDomain: "brejin-3229a.firebaseapp.com",
  projectId: "brejin-3229a",
  storageBucket: "brejin-3229a.firebasestorage.app",
  messagingSenderId: "745284665425",
  appId: "1:745284665425:web:f3f813361c73346400b870"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);


const codigoInput = document.getElementById("codigo");
const senhaInput = document.getElementById("senha");
const btnEntrar = document.getElementById("btnEntrar");
const mensagem = document.getElementById("mensagem");


async function fazerLogin() {

  const codigo = codigoInput.value.trim();
  const senha = senhaInput.value;

  mensagem.textContent = "";
  mensagem.style.color = "red";

  if (!codigo || !senha) {

    mensagem.textContent =
      "Digite o código e a senha.";

    return;
  }

  btnEntrar.disabled = true;
  btnEntrar.textContent = "ENTRANDO...";

  try {

    /*
     * Primeiro localizamos o usuário pelo código.
     *
     * A senha NÃO é buscada no Firestore.
     * Ela será validada pelo Firebase Authentication.
     */

    const usuariosRef = collection(db, "usuarios");

    const consulta = query(
      usuariosRef,
      where("codigo", "==", codigo)
    );

    const resultado = await getDocs(consulta);

    if (resultado.empty) {

      throw new Error(
        "Código ou senha inválidos."
      );
    }


    const documento = resultado.docs[0];

    const dadosUsuario = documento.data();

    const email = dadosUsuario.email;

    if (!email) {

      throw new Error(
        "Este usuário ainda não está configurado para autenticação."
      );
    }


    if (dadosUsuario.ativo !== true) {

      throw new Error(
        "Este usuário está desativado."
      );
    }


    /*
     * Firebase Authentication valida a senha.
     */

    const credencial =
      await signInWithEmailAndPassword(
        auth,
        email,
        senha
      );


    const uid = credencial.user.uid;


    /*
     * Segurança extra:
     * garantimos que o documento utilizado
     * corresponde ao UID autenticado.
     */

    if (uid !== documento.id) {

      await auth.signOut();

      throw new Error(
        "Usuário não corresponde à conta autenticada."
      );
    }


    /*
     * A partir daqui não precisamos guardar
     * empresaId ou papel no localStorage.
     *
     * O Firebase Authentication mantém a sessão.
     * As páginas poderão consultar usuarios/{uid}.
     */


    mensagem.style.color = "green";
    mensagem.textContent =
      "Login realizado. Entrando...";


    setTimeout(() => {

      window.location.href = "painel.html";

    }, 500);


  } catch (erro) {

    console.error("Erro no login:", erro);

    mensagem.style.color = "red";

    if (
      erro.code === "auth/invalid-credential" ||
      erro.code === "auth/wrong-password" ||
      erro.code === "auth/user-not-found"
    ) {

      mensagem.textContent =
        "Código ou senha inválidos.";

    } else {

      mensagem.textContent =
        erro.message || "Não foi possível entrar.";
    }

  } finally {

    btnEntrar.disabled = false;
    btnEntrar.textContent = "ENTRAR";
  }
}


btnEntrar.addEventListener(
  "click",
  fazerLogin
);


senhaInput.addEventListener(
  "keydown",
  (evento) => {

    if (evento.key === "Enter") {
      fazerLogin();
    }

  }
);

</script>

</body>
</html>
