<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cadastro de Vendedores</title>

<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }

body {
  padding: 20px;
  background: #f5f5f5;
}

h1, h2 {
  color: red;
}

input, button, select {
  padding: 8px;
  margin: 5px;
}

button {
  background: red;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 4px;
  width: 30%;
}

button:hover {
  background: blue;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  background: #fff;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}

th {
  background: white;
}

.vendor-row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  align-items: center;
}

.vendor-btn {
  flex: 1;
  text-align: left;
  background: yellow;
  color: #333;
  border: 1px solid #d0d0d0;
  padding: 12px 14px;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
}

.vendor-btn:hover {
  background: #f3f3f3;
}

.vendor-meta {
  font-size: 16px;
  color: #666;
  margin-left: 8px;
}

.vendor-del {
  background: black;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}

.vendor-del:hover {
  background: #990000;
}

#painelVendedor {
  margin-top: 20px;
  background: yellow;
  padding: 15px;
  border: 1px solid #b30000;
  border-radius: 6px;
  display: none;
}

.totais span {
  margin-right: 20px;
  font-weight: bold;
}

#areaEmpresa {
  display: none;
  background: white;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  margin-bottom: 15px;
}

#empresaSelecionadaInfo {
  font-weight: bold;
  color: #333;
}
</style>
</head>

<body>

<h1>CADASTRO DE VENDEDORES</h1>

<!-- Área usada somente pelo Master -->
<div id="areaEmpresa">
  <label><strong>Empresa:</strong></label>

  <select id="selectEmpresa" onchange="trocarEmpresa()">
    <option value="">Selecione uma empresa</option>
  </select>

  <div id="empresaSelecionadaInfo"></div>
</div>

<div>
  <input id="nome" placeholder="Nome do vendedor"/>

  <input
    id="cotacao"
    placeholder="Cotação"
    type="number"
    step="0.01"
    min="0"
  />

  <button onclick="salvarVendedor()">Salvar</button>
  <button onclick="editarVendedor()">Editar</button>
</div>

<div id="listaVendedores"></div>

<div id="painelVendedor">

  <h2 id="tituloVendedor"></h2>

  <button onclick="voltarCadastro()">Voltar ao cadastro</button>

  <div style="margin-top:15px;">

    <label>
      Filtrar por data:
      <input type="date" id="filtroData"/>
    </label>

    <button onclick="filtrarPorData()">Filtrar</button>

    <button onclick="limparFiltro()">Limpar filtro</button>

    <button onclick="exportarPDF()">Exportar em PDF</button>

    <button
      id="btnSalvarVendas"
      onclick="salvarVendas()"
      style="margin-left:10px;"
    >
      Salvar Vendas
    </button>

  </div>

  <button style="margin-top:15px;" onclick="adicionarLinha()">
    Adicionar venda
  </button>

  <table id="tabelaVendas">

    <thead>
      <tr>
        <th>Data</th>
        <th>Recebeu</th>
        <th>Devolveu</th>
        <th>Vendeu</th>
        <th>Apurou</th>
        <th>Pagou</th>
        <th>Deve</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody></tbody>

  </table>

  <div class="totais" style="margin-top:10px;">

    <span>
      Total Apurado:
      R$ <span id="totalApurado">0.00</span>
    </span>

    <span>
      Total Pagou:
      R$ <span id="totalPagou">0.00</span>
    </span>

    <span>
      Total Deve:
      R$ <span id="totalDeve">0.00</span>
    </span>

  </div>

</div>
<script type="module" src="./js/sessao.js"></script>
<script type="module">

import {
  getFirestore,
  collection,
  setDoc,
  doc,
  getDocs,
  deleteDoc,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

import {
  getApp,
  getApps,
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyCrEImfnBQvS-kyiXW9a6wgt9IHyPTaQqE",
  authDomain: "brejin-3229a.firebaseapp.com",
  projectId: "brejin-3229a",
  storageBucket: "brejin-3229a.firebasestorage.app",
  messagingSenderId: "745284665425",
  appId: "1:745284665425:web:f3f813361c73346400b870"
};


/* =========================================================
   APP FIREBASE
========================================================= */

const app = getApps().length
  ? getApp()
  : initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================================================
   SESSÃO
========================================================= */

await window.sessaoPronta;

const sessao = window.obterSessao();

if (!sessao || !sessao.autenticado) {
  alert("Sessão não autenticada.");
  window.location.href = "index.html";
}


/* =========================================================
   VARIÁVEIS
========================================================= */

let vendedores = [];
let vendas = {};

let vendedorAtual = null;
let empresaAtualId = null;

let empresasDisponiveis = [];


/* =========================================================
   EMPRESAS
========================================================= */

async function carregarEmpresasMaster() {

  if (!window.ehMaster()) {
    empresaAtualId = window.obterEmpresaId();

    if (!empresaAtualId) {
      alert("Usuário não está vinculado a uma empresa.");
      return false;
    }

    return true;
  }

  const snap = await getDocs(
    collection(db, "empresas")
  );

  empresasDisponiveis = [];

  snap.forEach(d => {

    const dados = d.data();

    empresasDisponiveis.push({
      id: d.id,
      ...dados
    });

  });

  const select = document.getElementById("selectEmpresa");

  select.innerHTML = `
    <option value="">Selecione uma empresa</option>
  `;

  empresasDisponiveis.forEach(empresa => {

    const nome =
      empresa.nome ||
      empresa.razaoSocial ||
      empresa.nomeEmpresa ||
      `Empresa ${empresa.id}`;

    const option = document.createElement("option");

    option.value = empresa.id;
    option.textContent = nome;

    select.appendChild(option);

  });

  document.getElementById("areaEmpresa").style.display = "block";

  if (empresasDisponiveis.length > 0) {

    empresaAtualId = empresasDisponiveis[0].id;

    select.value = empresaAtualId;

    atualizarEmpresaSelecionada();

  }

  return true;
}


/* =========================================================
   TROCAR EMPRESA - MASTER
========================================================= */

async function trocarEmpresa() {

  const select = document.getElementById("selectEmpresa");

  empresaAtualId = select.value;

  vendedorAtual = null;

  document.getElementById("painelVendedor").style.display = "none";

  document.querySelector("#tabelaVendas tbody").innerHTML = "";

  if (!empresaAtualId) {

    vendedores = [];
    vendas = {};

    listarVendedores();

    return;
  }

  atualizarEmpresaSelecionada();

  await carregarDadosEmpresa();

}


function atualizarEmpresaSelecionada() {

  const empresa =
    empresasDisponiveis.find(
      e => e.id === empresaAtualId
    );

  const nome =
    empresa?.nome ||
    empresa?.razaoSocial ||
    empresa?.nomeEmpresa ||
    empresaAtualId;

  document.getElementById(
    "empresaSelecionadaInfo"
  ).textContent =
    `Empresa selecionada: ${nome}`;

}


/* =========================================================
   VERIFICAÇÃO DA EMPRESA
========================================================= */

function verificarEmpresa() {

  if (!empresaAtualId) {

    alert(
      "Selecione uma empresa antes de continuar."
    );

    return false;
  }

  return true;
}


/* =========================================================
   CAMINHOS FIRESTORE
========================================================= */

function caminhoVendedores() {

  return collection(
    db,
    "empresas",
    empresaAtualId,
    "vendedores"
  );

}


function caminhoVendas() {

  return collection(
    db,
    "empresas",
    empresaAtualId,
    "vendas"
  );

}


/* =========================================================
   CARREGAR VENDEDORES
========================================================= */

async function carregarVendedoresFirestore() {

  if (!verificarEmpresa()) {
    return [];
  }

  const snap =
    await getDocs(caminhoVendedores());

  const lista = [];

  snap.forEach(d => {

    lista.push({
      id: d.id,
      ...d.data()
    });

  });

  return lista;
}


/* =========================================================
   CARREGAR VENDAS
========================================================= */

async function carregarVendasFirestore(vendedor) {

  if (!verificarEmpresa()) {
    return [];
  }

  if (!vendedor?.id) {
    return [];
  }

  const q = query(
    caminhoVendas(),
    where("vendedorId", "==", vendedor.id)
  );

  const snap = await getDocs(q);

  const lista = [];

  snap.forEach(d => {

    lista.push({
      id: d.id,
      ...d.data()
    });

  });

  return lista;
}


/* =========================================================
   CARREGAR EMPRESA
========================================================= */

async function carregarDadosEmpresa() {

  if (!verificarEmpresa()) {
    vendedores = [];
    vendas = {};
    listarVendedores();
    return;
  }

  try {

    vendedores =
      await carregarVendedoresFirestore();

    vendas = {};

    for (const vendedor of vendedores) {

      vendas[vendedor.id] =
        await carregarVendasFirestore(vendedor);

    }

    listarVendedores();

  } catch (erro) {

    console.error(
      "Erro ao carregar dados:",
      erro
    );

    alert(
      "Erro ao carregar os dados da empresa."
    );

  }

}


/* =========================================================
   SALVAR VENDEDOR
========================================================= */

async function salvarVendedor() {

  if (!verificarEmpresa()) return;

  const nome =
    document.getElementById("nome")
      .value.trim();

  const cotacao =
    parseFloat(
      document.getElementById("cotacao").value
    );

  if (
    !nome ||
    isNaN(cotacao) ||
    cotacao <= 0
  ) {

    alert(
      "Preencha corretamente o nome e cotação maior que zero."
    );

    return;
  }


  const existente =
    vendedores.find(
      v =>
        v.nome.toLowerCase() ===
        nome.toLowerCase()
    );

  if (existente) {

    alert("Vendedor já cadastrado.");

    return;
  }


  try {

    const novoDoc =
      doc(caminhoVendedores());

    const vendedor = {

      nome: nome,

      cotacao: cotacao,

      criadoEm: new Date().toISOString(),

      empresaId: empresaAtualId

    };

    await setDoc(
      novoDoc,
      vendedor
    );


    vendedores.push({

      id: novoDoc.id,

      ...vendedor

    });

    vendas[novoDoc.id] = [];


    listarVendedores();

    document.getElementById("nome").value = "";

    document.getElementById("cotacao").value = "";


    alert(
      "Vendedor cadastrado com sucesso."
    );

  } catch (erro) {

    console.error(
      "Erro ao salvar vendedor:",
      erro
    );

    alert(
      "Não foi possível salvar o vendedor."
    );

  }

}


/* =========================================================
   EDITAR VENDEDOR
========================================================= */

async function editarVendedor() {

  if (!verificarEmpresa()) return;

  const nome =
    document.getElementById("nome")
      .value.trim();

  const cotacao =
    parseFloat(
      document.getElementById("cotacao").value
    );

  if (
    !nome ||
    isNaN(cotacao) ||
    cotacao <= 0
  ) {

    alert(
      "Preencha corretamente o nome e cotação maior que zero."
    );

    return;
  }


  const index =
    vendedores.findIndex(
      v =>
        v.nome.toLowerCase() ===
        nome.toLowerCase()
    );


  if (index === -1) {

    alert(
      "Vendedor não encontrado."
    );

    return;
  }


  const vendedor =
    vendedores[index];


  try {

    await setDoc(

      doc(
        db,
        "empresas",
        empresaAtualId,
        "vendedores",
        vendedor.id
      ),

      {
        ...vendedor,

        cotacao: cotacao,

        atualizadoEm:
          new Date().toISOString()

      }

    );


    vendedores[index].cotacao =
      cotacao;


    listarVendedores();

    alert(
      "Cotação atualizada."
    );


    if (
      vendedorAtual === vendedor.id
    ) {

      atualizarTabela();

    }

  } catch (erro) {

    console.error(
      "Erro ao editar vendedor:",
      erro
    );

    alert(
      "Não foi possível atualizar a cotação."
    );

  }

}


/* =========================================================
   LISTAR VENDEDORES
========================================================= */

function listarVendedores() {

  const div =
    document.getElementById(
      "listaVendedores"
    );

  div.innerHTML = "";


  vendedores.forEach(v => {

    const row =
      document.createElement("div");

    row.className =
      "vendor-row";


    const btn =
      document.createElement("button");

    btn.className =
      "vendor-btn";


    btn.innerHTML = `
      <strong>${v.nome}</strong>
      <span class="vendor-meta">
        Cotação: R$ ${Number(v.cotacao).toFixed(2)}
      </span>
    `;


    btn.onclick =
      () => abrirPainel(v.id);


    const del =
      document.createElement("button");

    del.className =
      "vendor-del";

    del.textContent =
      "Excluir";


    del.onclick =
      async e => {

        e.stopPropagation();


        if (
          !confirm(
            `Confirma a exclusão do vendedor "${v.nome}" e todo histórico?`
          )
        ) {

          return;

        }


        try {

          /*
           * Exclui todas as vendas
           * pertencentes ao vendedor.
           */

          const q =
            query(
              caminhoVendas(),
              where(
                "vendedorId",
                "==",
                v.id
              )
            );


          const snap =
            await getDocs(q);


          const exclusoes = [];


          snap.forEach(d => {

            exclusoes.push(
              deleteDoc(
                doc(
                  db,
                  "empresas",
                  empresaAtualId,
                  "vendas",
                  d.id
                )
              )
            );

          });


          await Promise.all(
            exclusoes
          );


          /*
           * Exclui o vendedor.
           */

          await deleteDoc(

            doc(
              db,
              "empresas",
              empresaAtualId,
              "vendedores",
              v.id
            )

          );


          vendedores =
            vendedores.filter(
              x => x.id !== v.id
            );


          delete vendas[v.id];


          if (
            vendedorAtual === v.id
          ) {

            voltarCadastro();

          }


          listarVendedores();


          alert(
            `Vendedor "${v.nome}" excluído.`
          );


        } catch (erro) {

          console.error(
            "Erro ao excluir vendedor:",
            erro
          );

          alert(
            "Não foi possível excluir o vendedor."
          );

        }

      };


    row.appendChild(btn);

    row.appendChild(del);

    div.appendChild(row);

  });

}


/* =========================================================
   PAINEL DO VENDEDOR
========================================================= */

function abrirPainel(id) {

  vendedorAtual = id;


  const vendedor =
    vendedores.find(
      v => v.id === id
    );


  if (!vendedor) return;


  document.getElementById(
    "painelVendedor"
  ).style.display = "block";


  document.getElementById(
    "tituloVendedor"
  ).textContent =
    vendedor.nome;


  atualizarTabela();

}


/* =========================================================
   ADICIONAR LINHA
========================================================= */

function adicionarLinha() {

  const tbody =
    document.querySelector(
      "#tabelaVendas tbody"
    );


  const tr =
    document.createElement("tr");


  tr.innerHTML = `

<td>
  <input type="date"/>
</td>

<td>
  <input
    type="number"
    onchange="calcularLinha(this)"
    min="0"
  />
</td>

<td>
  <input
    type="number"
    onchange="calcularLinha(this)"
    min="0"
  />
</td>

<td>
  <input
    type="number"
    readonly
  />
</td>

<td>
  <input
    type="number"
    readonly
  />
</td>

<td>
  <input
    type="number"
    onchange="calcularLinha(this)"
    min="0"
  />
</td>

<td>
  <input
    type="number"
    readonly
  />
</td>

<td class="acoes">

  <button onclick="editarLinha(this)">
    Editar
  </button>

  <button onclick="excluirLinha(this)">
    Excluir
  </button>

</td>

`;


  tbody.appendChild(tr);

}


/* =========================================================
   EDITAR LINHA
========================================================= */

function editarLinha(btn) {

  const inputs =
    btn.parentElement
      .parentElement
      .querySelectorAll("input");


  inputs.forEach(
    i => i.readOnly = false
  );

}


/* =========================================================
   EXCLUIR LINHA
========================================================= */

function excluirLinha(btn) {

  btn.parentElement
    .parentElement
    .remove();


  salvarVendas();

}


/* =========================================================
   CALCULAR LINHA
========================================================= */

function calcularLinha(elem) {

  const tr =
    elem.closest("tr");


  const inputs =
    tr.querySelectorAll("input");


  const recebeu =
    parseFloat(inputs[1].value) || 0;


  const devolveu =
    parseFloat(inputs[2].value) || 0;


  const pagou =
    parseFloat(inputs[5].value) || 0;


  const vendeu =
    recebeu - devolveu;


  const vendedor =
    vendedores.find(
      v => v.id === vendedorAtual
    );


  const cotacao =
    vendedor?.cotacao || 1;


  const apurou =
    vendeu * cotacao;


  const deve =
    apurou - pagou;


  inputs[3].value =
    vendeu;


  inputs[4].value =
    apurou.toFixed(2);


  inputs[6].value =
    deve.toFixed(2);


  atualizarTotais();

}


/* =========================================================
   SALVAR VENDAS
========================================================= */

async function salvarVendas() {

  if (!verificarEmpresa()) return;

  if (!vendedorAtual) return;


  const vendedor =
    vendedores.find(
      v => v.id === vendedorAtual
    );


  if (!vendedor) {

    alert(
      "Vendedor não encontrado."
    );

    return;

  }


  const linhas =
    document.querySelectorAll(
      "#tabelaVendas tbody tr"
    );


  const lista = [];


  linhas.forEach(tr => {

    const inputs =
      tr.querySelectorAll("input");


    lista.push({

      data:
        inputs[0].value,

      recebeu:
        parseFloat(inputs[1].value) || 0,

      devolveu:
        parseFloat(inputs[2].value) || 0,

      vendeu:
        parseFloat(inputs[3].value) || 0,

      apurou:
        parseFloat(inputs[4].value) || 0,

      pagou:
        parseFloat(inputs[5].value) || 0,

      deve:
        parseFloat(inputs[6].value) || 0,

      cotacao:
        vendedor.cotacao,

      vendedorId:
        vendedor.id,

      vendedorNome:
        vendedor.nome,

      empresaId:
        empresaAtualId,

      atualizadoEm:
        new Date().toISOString()

    });

  });


  try {

    /*
     * Primeiro remove as vendas
     * antigas desse vendedor.
     */

    const q =
      query(
        caminhoVendas(),
        where(
          "vendedorId",
          "==",
          vendedor.id
        )
      );


    const snap =
      await getDocs(q);


    const exclusoes = [];


    snap.forEach(d => {

      exclusoes.push(
        deleteDoc(
          doc(
            db,
            "empresas",
            empresaAtualId,
            "vendas",
            d.id
          )
        )
      );

    });


    await Promise.all(
      exclusoes
    );


    /*
     * Depois grava novamente
     * as vendas atuais.
     */

    const novasVendas = [];


    for (
      let i = 0;
      i < lista.length;
      i++
    ) {

      const venda =
        lista[i];


      const novoDoc =
        doc(caminhoVendas());


      await setDoc(
        novoDoc,
        {
          ...venda,
          indice: i
        }
      );


      novasVendas.push({

        id: novoDoc.id,

        ...venda

      });

    }


    vendas[vendedor.id] =
      novasVendas;


    atualizarTotais();


    alert(
      "Vendas salvas com sucesso."
    );


  } catch (erro) {

    console.error(
      "Erro ao salvar vendas:",
      erro
    );

    alert(
      "Não foi possível salvar as vendas."
    );

  }

}


/* =========================================================
   ATUALIZAR TABELA
========================================================= */

function atualizarTabela(
  filtrarData = ""
) {

  const tbody =
    document.querySelector(
      "#tabelaVendas tbody"
    );


  tbody.innerHTML = "";


  (
    vendas[vendedorAtual] || []
  ).forEach(v => {

    if (
      filtrarData &&
      v.data !== filtrarData
    ) {

      return;

    }


    const tr =
      document.createElement("tr");


    tr.innerHTML = `

<td>
  <input
    type="date"
    value="${v.data || ""}"
  />
</td>

<td>
  <input
    type="number"
    value="${v.recebeu ?? 0}"
    onchange="calcularLinha(this)"
    min="0"
  />
</td>

<td>
  <input
    type="number"
    value="${v.devolveu ?? 0}"
    onchange="calcularLinha(this)"
    min="0"
  />
</td>

<td>
  <input
    type="number"

`;


    tbody.appendChild(tr);

  });


  atualizarTotais();

}


/* =========================================================
   TOTAIS
========================================================= */

function atualizarTotais() {

  const linhas =
    document.querySelectorAll(
      "#tabelaVendas tbody tr"
    );


  let apurado = 0;

  let pagou = 0;


  linhas.forEach(tr => {

    const inputs =
      tr.querySelectorAll("input");


    apurado +=
      parseFloat(inputs[4].value) || 0;


    pagou +=
      parseFloat(inputs[5].value) || 0;

  });


  document.getElementById(
    "totalApurado"
  ).textContent =
    apurado.toFixed(2);


  document.getElementById(
    "totalPagou"
  ).textContent =
    pagou.toFixed(2);


  document.getElementById(
    "totalDeve"
  ).textContent =
    (apurado - pagou).toFixed(2);

}


/* =========================================================
   FILTRO
========================================================= */

function filtrarPorData() {

  atualizarTabela(
    document.getElementById(
      "filtroData"
    ).value
  );

}


function limparFiltro() {

  document.getElementById(
    "filtroData"
  ).value = "";


  atualizarTabela();

}

========================================================= */

}


/* =========================================================
   VOLTAR
========================================================= */

function voltarCadastro() {

  document.getElementById(
    "painelVendedor"
  ).style.display = "none";


  vendedorAtual = null;


  document.querySelector(
    "#tabelaVendas tbody"
  ).innerHTML = "";


  document.getElementById(
    "totalApurado"
  ).textContent = "0.00";


  document.getElementById(
    "totalPagou"
  ).textContent = "0.00";


  document.getElementById(
    "totalDeve"
  ).textContent = "0.00";

}
