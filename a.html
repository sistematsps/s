<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>MENU CENTRAL</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
    background:#f4f4f4;
}

table{
    width:100%;
    height:100vh;
    border-collapse:collapse;
}

td{
    padding:10px;
    vertical-align:top;
}

.topo{
    background:#2196f3;
    color:white;
    text-align:center;
    font-size:35px;
    padding:20px;
    font-weight:bold;
}

.menu{
    width:30%;
    background:#eaeaea;
}

button{
    width:100%;
    padding:20px;
    margin-bottom:10px;
    font-size:18px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:#2196f3;
    color:white;
    transition:0.3s;
}

button:hover{
    background:#0b7dda;
}

iframe{
    width:100%;
    height:850px;
    border:none;
    border-radius:10px;
    background:white;
}

</style>
</head>

<body>

<table border="1">

    <!-- TOPO -->
    <tr>
        <td colspan="2" class="topo">
            PAINEL CENTRAL SISTEMA DE PRESTAMENTO DE CONTAS
        </td>
    </tr>

    <!-- MENU + CONTEÚDO -->
    <tr>

        <!-- MENU ESQUERDO -->
        <td class="menu">

            <!-- GOOGLE DRIVE -->
            <button onclick="carregarPagina('https://drive.google.com/embeddedfolderview?id=1wMUut_8LRlE-5NeqDcH_mI34IhVkT7wv#list')">
                MEUS CURSOS
            </button>

            <!-- PITIMBU -->
            <button onclick="carregarPagina('https://sistematsps.github.io/pitimbu/painel.html')">
                PITIMBU DA SORTE
            </button>

            <!-- TIMONHA -->
            <button onclick="carregarPagina('https://sistematsps.github.io/timonha/painel.html')">
                TIMONHA DA SORTE
            </button>

            <!-- CAIXA -->
            <button onclick="carregarPagina('https://sistematsps.github.io/s/caixa2.0.html')">
                CAIXA 2.0
            </button>

            <!-- WHATS -->
            <button onclick="carregarPagina('https://benedito1552.github.io/Whats/')">
                WHATS PITIMBU
            </button>

            <!-- LIMPAR -->
            <button onclick="fecharSistema()">
                FECHAR CONTEÚDO
            </button>

        </td>

        <!-- ÁREA DE CONTEÚDO -->
        <td width="70%">

            <iframe
                id="areaConteudo"
                name="areaConteudo"
                src="">
            </iframe>

        </td>

    </tr>

</table>

<script>

function carregarPagina(url){

    document.getElementById("areaConteudo").src = url;

}

function fecharSistema(){

    document.getElementById("areaConteudo").src = "";

}

</script>

</body>
</html>
